name: ABC Node CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    if: startsWith(github.head_ref, 'test/abc-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test test/*.test.mjs
